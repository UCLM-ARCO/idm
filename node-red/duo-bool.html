<script type="text/javascript">
 RED.nodes.registerType('IBool', {
     category: 'IDM',
     color: '#a6bb00',
     defaults: {
	 name: {value: ""},
	 dst: {value: "", required: true},
	 router: {value: "", type: "idm-router"},
     },
     inputs:1,
     outputs:0,
     icon: "light.png",
     align: 'right',

     label: function() {
	 if (this.dst)
	     return this.dst.toUpperCase();
	 return this.name || "IBool";
     },
 });


</script>

<script type="text/x-red" data-template-name="IBool">
 <div class="form-row">
   <label for="node-input-dst"><i class="fa fa-fw fa-suitcase"></i> Destination: </label>
   <input type="text" id="node-input-dst" placeholder="aa:bb">
 </div>

 <div class="form-row">
   <label for="node-input-router"><i class="fa fa-fw fa-map-signs"></i> IDM Router: </label>
   <input type="text" id="node-input-router">
 </div>
</script>

<script type="text/x-red" data-help-name="IBool">
  <p>This node provides access to an IBool.W object, through IDM.</p>

  <p>It has two properties that should be set:</p>
  <ul>
    <li><b>Destination</b>: the IDM address (like <code>10:01</code>)</li>
    <li><b>IDM Router</b>: the router to use (see below)</li>
  </ul>

  <p>When an input with payload <code>true</code> or <code>false</code> is connected, it will
    send a <b>set</b> message to the given destination</p>

  <p>The <code>IBool.W</code> interface is the following:
    <pre>
module IBool {
  interface W {
    void set(bool v, IDM::Address source);
  };
};
    </pre>
  </p>
</script>
