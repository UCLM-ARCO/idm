<script type="text/javascript">
    RED.nodes.registerType('router', {
        category: 'IDM',
        color: '#a6bbcf',
        defaults: {
            name: {value:""},
	    address: {value:""},
        },
        inputs:0,
        outputs:1,
        icon: "router.png",

        label: function() {
	    if (! this.address)
		return this.name || "router";

	    var retval = this.address;
	    if (this.name)
		retval += " [" + this.name + "]";
	    return retval;
        }
    });
</script>

<script type="text/x-red" data-template-name="router">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-address"><i class="icon-tag"></i> Address</label>
    <input type="text" id="node-input-address" placeholder="aa:bb">
  </div>
</script>

<script type="text/x-red" data-help-name="router">
    <p>A IDM router</p>
</script>
