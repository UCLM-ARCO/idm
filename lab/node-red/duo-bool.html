<script type="text/javascript">
 RED.nodes.registerType('IBool', {
     category: 'IDM',
     color: '#a6bb00',
     defaults: {
	 name: {value: ""},
	 dst: {value: "", required: true},
	 router: {value: "", type: "idm-router"},
     },
     inputs:1,
     outputs:0,
     icon: "light.png",
     align: 'right',

     label: function() {
	 if (this.dst)
	     return this.dst.toUpperCase();
	 return this.name || "IBool";
     },
 });


</script>
